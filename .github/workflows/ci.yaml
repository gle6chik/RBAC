name: RBAC CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
  
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Compile Java files
        run: |
          mkdir -p out
          find src -name "*.java" -print | xargs javac -d out
          echo "Компиляция прошла успешно!"
      - name: Create JAR
        run: |
          jar cf rbac-app.jar -C out .
          echo "JAR создан: rbac-app.jar"
      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: rbac-app
          path: rbac-app.jar
      - name: Show branch information
        run: |
          echo "Сборка запущена для ветки ${{ github.ref_name }}"
          echo "Коммит: ${{ github.sha }}"
          echo "Автор: ${{ github.actor }}"
