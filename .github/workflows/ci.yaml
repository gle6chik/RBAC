name: RBAC CI

on:
  push:
    branches:
      - dev
      - 'feature/**'
  
  pull_request:
    branches:
      - dev
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rbac-app
          path: build/libs/*.jar

      - name: Show branch information
        run: |
          echo "Сборка запущена для ветки ${{ github.ref_name }}"
          echo "Коммит: ${{ github.sha }}"
          echo "Автор: ${{ github.actor }}"
